name: Build

on:
  push:
    branches:
      - main
      - phase-a-diagnostics
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the built mod JAR'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farmer-automation-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: farmer-automation-jar
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Farmer Automation Build ${{ github.run_number }}
          body: |
            Aşama 1 test derlemesi.

            Bu sürüm yalnızca kontrol paneli, durum yönetimi ve JSON ayarlarını içerir.
            Shop, köylü tarama, navigasyon, gerçek envanter okuma ve Shulker depolama henüz uygulanmadı.
          files: release-files/*.jar
